<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CBarin 业务能力闭环</title>
  <desc id="desc">对话、成功工作过程、业务文档和代码仓库沉淀为长期记忆、Skill、Wiki/RAG、CodeGraph，由 CBarin 治理并提供给 Codex Plugin、Claude Code Plugin 和 HiperOne Agent。</desc>
  <defs>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
    <style>
      text{font-family:Inter,"Microsoft YaHei","PingFang SC",sans-serif}.h1{font-size:30px;font-weight:700;fill:#172554}.sub{font-size:14px;fill:#64748b}.step{font-size:17px;font-weight:700;fill:#334155}.name{font-size:17px;font-weight:700}.detail{font-size:12px;fill:#64748b}.box{fill:#fff;filter:url(#shadow)}.lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:6 6}.edge{fill:none;stroke:#94a3b8;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="60" y="70" class="h1">让团队经验成为每个 Agent 的长期能力</text>
  <text x="60" y="101" class="sub">工作中产生经验 → 沉淀为资产 → CBarin 治理与分配 → 外部 Agent 按需使用 → 经验持续回流</text>

  <rect x="60" y="150" width="290" height="560" rx="24" class="lane"/><text x="85" y="196" class="step">01  工作中产生经验</text>
  <rect x="85" y="225" width="240" height="88" rx="16" class="box" stroke="#93c5fd" stroke-width="2"/><text x="108" y="262" class="name" fill="#1e3a8a">对话</text><text x="108" y="288" class="detail">事实、偏好与上下文</text>
  <rect x="85" y="335" width="240" height="88" rx="16" class="box" stroke="#86efac" stroke-width="2"/><text x="108" y="372" class="name" fill="#166534">验证成功的工作过程</text><text x="108" y="398" class="detail">可重复的方法与步骤</text>
  <rect x="85" y="445" width="240" height="88" rx="16" class="box" stroke="#fcd34d" stroke-width="2"/><text x="108" y="482" class="name" fill="#92400e">业务文档</text><text x="108" y="508" class="detail">方案 · 规范 · 踩坑记录</text>
  <rect x="85" y="555" width="240" height="88" rx="16" class="box" stroke="#c4b5fd" stroke-width="2"/><text x="108" y="592" class="name" fill="#5b21b6">代码仓库</text><text x="108" y="618" class="detail">文件、符号与调用关系</text>

  <rect x="405" y="150" width="300" height="560" rx="24" class="lane"/><text x="430" y="196" class="step">02  沉淀为记忆资产</text>
  <rect x="435" y="225" width="240" height="88" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/><text x="555" y="262" text-anchor="middle" class="name" fill="#1d4ed8">长期记忆</text><text x="555" y="288" text-anchor="middle" class="detail">事实 · 场景 · 画像</text>
  <rect x="435" y="335" width="240" height="88" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2" filter="url(#shadow)"/><text x="555" y="372" text-anchor="middle" class="name" fill="#15803d">Skill</text><text x="555" y="398" text-anchor="middle" class="detail">可复用工作方法</text>
  <rect x="435" y="445" width="240" height="88" rx="16" fill="#fffbeb" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/><text x="555" y="482" text-anchor="middle" class="name" fill="#b45309">Wiki/RAG</text><text x="555" y="508" text-anchor="middle" class="detail">检索问答 · 原文溯源 · 关联发现</text>
  <rect x="435" y="555" width="240" height="88" rx="16" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2" filter="url(#shadow)"/><text x="555" y="592" text-anchor="middle" class="name" fill="#6d28d9">CodeGraph</text><text x="555" y="618" text-anchor="middle" class="detail">代码结构与影响路径</text>

  <text x="925" y="196" text-anchor="middle" class="step">03  统一治理与分配</text>
  <rect x="775" y="280" width="300" height="260" rx="25" fill="url(#hub)" stroke="#1e40af" stroke-width="2" filter="url(#shadow)"/>
  <text x="925" y="350" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">CBarin</text><text x="925" y="380" text-anchor="middle" font-size="13" fill="#dbeafe">团队经验的治理与装配中心</text>
  <line x1="825" y1="410" x2="1025" y2="410" stroke="#93c5fd" opacity=".55"/><text x="925" y="452" text-anchor="middle" font-size="15" fill="#fff">团队隔离　·　权限共享</text><text x="925" y="487" text-anchor="middle" font-size="15" fill="#fff">Agent 分配　·　版本审核</text>

  <rect x="1145" y="150" width="390" height="560" rx="24" class="lane"/><text x="1170" y="196" class="step">04  外部 Agent 按需接入</text>
  <rect x="1175" y="225" width="330" height="95" rx="16" class="box" stroke="#60a5fa" stroke-width="2"/><text x="1200" y="264" class="name" fill="#1e3a8a">Codex Plugin</text><text x="1200" y="292" class="detail">记忆 · Skill · Wiki/RAG · CodeGraph</text>
  <rect x="1175" y="345" width="330" height="95" rx="16" class="box" stroke="#60a5fa" stroke-width="2"/><text x="1200" y="384" class="name" fill="#1e3a8a">Claude Code Plugin</text><text x="1200" y="412" class="detail">按身份装配所需能力</text>
  <rect x="1175" y="465" width="330" height="95" rx="16" class="box" stroke="#60a5fa" stroke-width="2"/><text x="1200" y="504" class="name" fill="#1e3a8a">HiperOne Agent</text><text x="1200" y="532" class="detail">可选择完整能力或单一能力</text>
  <rect x="1195" y="585" width="290" height="90" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/><text x="1340" y="622" text-anchor="middle" font-size="17" font-weight="700" fill="#b45309">Wiki/RAG 专项知识赋能</text><text x="1340" y="651" text-anchor="middle" font-size="12" fill="#92400e">新项目方案参考 · 历史踩坑沉淀</text>

  <path d="M325 269H435" class="edge"/><path d="M325 379H435" class="edge"/><path d="M325 489H435" class="edge"/><path d="M325 599H435" class="edge"/>
  <path d="M675 269H730V340H775" fill="none" stroke="#3b82f6" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M675 379H775" fill="none" stroke="#22c55e" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M675 489H730V460H775" fill="none" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M675 599H745V505H775" fill="none" stroke="#8b5cf6" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M1075 340H1120V272H1175" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M1075 410H1175" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M1075 480H1120V512H1175" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M675 489H1100V630H1195" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="1020" y="615" font-size="12" fill="#92400e">能力裁剪</text>

  <rect x="485" y="780" width="610" height="55" rx="28" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/><text x="790" y="814" text-anchor="middle" font-size="14" fill="#3730a3">新一轮工作产生的新经验，继续回到 CBarin 沉淀</text>
  <path d="M1505 512H1560V808H1095" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/><path d="M485 808H35V430H60" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
</svg>
